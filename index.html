        const angle = (Math.PI * 2 * i) / count;
        const distance = 80 + Math.random() * 130;
        piece.style.setProperty("--x", Math.round(Math.cos(angle) * distance) + "px");
        piece.style.setProperty("--y", Math.round(Math.sin(angle) * distance) + "px");
        target.append(piece);
      }
    }
    function renderQuestion() {
      evaluated = false;
      selectedAnswer = null;
      const q = questions[index];
      displayedOptions = shuffle(q.options);
      $("progress-label").textContent = `Câu ${index + 1}/5`;
      $("score-display").textContent = `Đúng ${score}/5`;
      $("progress-fill").style.width = `${(index + 1) * 20}%`;
      $("progress-track").setAttribute("aria-valuenow", String(index + 1));
      $("question-text").textContent = q.text;
      $("feedback").textContent = "";
      $("feedback").className = "feedback";
      $("quiz-burst").replaceChildren();
      answerButtons.forEach((button, i) => {
        button.disabled = false;
        button.classList.remove("is-correct","is-wrong","is-reveal");
        button.querySelector(".answer-text").textContent = displayedOptions[i].text;
        button.setAttribute("aria-label", `${"ABCD"[i]}. ${displayedOptions[i].text}`);
      });
    }
    function startQuiz() {
      clearTimeout(transitionTimer);
      runToken++;
      const active = questionBank.filter(validQuestion);
      if (active.length < 5 || new Set(active.map(q => q.id)).size !== active.length) {
        $("start-intro").textContent = "Bộ câu hỏi cần ít nhất 5 câu hợp lệ, mỗi câu có 4 đáp án và 1 đáp án đúng.";
        return;
      }
      questions = shuffle(active).slice(0,5);
      index = 0; score = 0; selectedAnswer = null; evaluated = false;
      $("result-burst").replaceChildren();
      showScreen("quiz-screen");
      renderQuestion();
    }
    function chooseAnswer(position) {
      if (evaluated || $("quiz-screen").hidden) return;
      evaluated = true;
      const token = runToken;
      selectedAnswer = displayedOptions[position].id;
      const correctId = questions[index].correctOptionId;
      const correct = selectedAnswer === correctId;
      if (correct) score++;
      $("score-display").textContent = `Đúng ${score}/5`;
      answerButtons.forEach((button,i) => {
        button.disabled = true;
        if (i === position) button.classList.add(correct ? "is-correct" : "is-wrong");
        else if (!correct && displayedOptions[i].id === correctId) button.classList.add("is-reveal");
      });
      $("feedback").className = `feedback ${correct ? "good" : "bad"}`;
      $("feedback").textContent = correct ? "Tôi quý ông phết ông ạ." : "Mình ko thân đến thế bạn ơi.";
      if (correct) burst($("quiz-burst"), 9);
      transitionTimer = setTimeout(() => {
        if (token !== runToken || !evaluated || $("quiz-screen").hidden) return;
        index++;
        if (index === 5) showResult();
        else renderQuestion();
      }, 1500);
    }
    function showResult() {
      showScreen("result-screen");
      $("result-score").textContent = `${score}/5 câu đúng`;
      const result = score === 5
        ? {reaction:"🥳✨",category:"HD",message:"Ra ngoài xã hội lúc nào bạn cần đỡ 1 nhát cứ gọi mình."}
        : score >= 3
        ? {reaction:"😳💛",category:"T tưởng mình thân nhau lắm mà?",message:"Tại sao 2 không được 5/5?"}
        : {reaction:"🧳☁️",category:"Chia hành lý",message:"Giang hồ đứt gánh. F4 chia hành lý ở đây"};
      $("result-reaction").textContent = result.reaction;
      $("result-category").textContent = result.category;
      $("result-message").textContent = result.message;
      if (score === 5) burst($("result-burst"), 15);
      $("restart-button").focus();
    }
    $("start-button").addEventListener("click", startQuiz);
    $("restart-button").addEventListener("click", startQuiz);
    answerButtons.forEach((button,i) => button.addEventListener("click", () => chooseAnswer(i)));
  </script>
 
</body></html>
